plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'FabricMC'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        tierspoofer {
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // optional
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// in-game tests: ./gradlew runProductionClientGameTest (runs the built jar in a real client)
sourceSets {
    gametest {
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
        runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
    }
}

tasks.register('gametestJar', Jar) {
    from sourceSets.gametest.output
    archiveClassifier = 'gametest-dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}

tasks.register('remapGametestJar', net.fabricmc.loom.task.RemapJarTask) {
    inputFile = tasks.named('gametestJar').flatMap { it.archiveFile }
    archiveClassifier = 'gametest'
    destinationDirectory = layout.buildDirectory.dir('testlibs')
    classpath.from sourceSets.gametest.compileClasspath
}

configurations {
    productionRuntimeMods {
        transitive = false
    }
}

dependencies {
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // not in the fabric-api bundle
    productionRuntimeMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_version)
}

tasks.register('runProductionClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from configurations.productionRuntimeMods
    mods.from tasks.remapJar
    mods.from tasks.remapGametestJar
    jvmArgs.addAll([
        "-Dfabric.client.gametest",
        "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
    ])
}
