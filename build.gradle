plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'FabricMC'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        tierspoofer {
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from('NOTICE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from('THIRD_PARTY_NOTICES.md')
    from('licenses') {
        into 'licenses'
    }
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
        runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
    }
}

tasks.register('gametestJar', Jar) {
    from sourceSets.gametest.output
    archiveClassifier = 'gametest-dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}

tasks.register('remapGametestJar', net.fabricmc.loom.task.RemapJarTask) {
    inputFile = tasks.named('gametestJar').flatMap { it.archiveFile }
    archiveClassifier = 'gametest'
    destinationDirectory = layout.buildDirectory.dir('testlibs')
    classpath.from sourceSets.gametest.compileClasspath
}

configurations {
    productionRuntimeMods {
        transitive = false
    }
}

dependencies {
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    productionRuntimeMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_version)
}

tasks.register('runProductionClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from configurations.productionRuntimeMods
    mods.from tasks.remapJar
    mods.from tasks.remapGametestJar
    jvmArgs.addAll([
        "-Dfabric.client.gametest",
        "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
    ])
}

def licenseHeader = '''// TierSpoofer - Copyright (c) 2026 Tellegram (Telle-dev)
// SPDX-License-Identifier: GPL-3.0-only
// See LICENSE. Modified versions must stay GPL-3.0, keep this notice and credit the original.
'''

tasks.register('licenseHeaders') {
    group = 'build'
    description = 'Adds the license notice to every Java file that is missing it'
    def sources = fileTree('src') { include '**/*.java' }
    doLast {
        sources.each { file ->
            String text = file.getText('UTF-8')
            String eol = text.contains('\r\n') ? '\r\n' : '\n'
            String header = licenseHeader.replace('\n', eol)
            if (text.startsWith(header)) return
            text = text.replaceFirst(/(?s)\A\/\/ TierSpoofer - Copyright.*?\n(?=\s*package )/, '').replaceFirst(/\A\s+/, '')
            file.write(header + eol + text, 'UTF-8')
        }
    }
}

tasks.withType(JavaCompile).configureEach { dependsOn 'licenseHeaders' }
