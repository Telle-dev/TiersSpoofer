name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: tierspoofer-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      # Pushing a tag like v1.0.0 publishes a release with the jar attached.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TierSpoofer ${{ github.ref_name }} for 1.21.11
          generate_release_notes: true
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
